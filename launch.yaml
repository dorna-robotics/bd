# bd — launch config.
#
# Rack slot D5 holds the OPEN reservoir tube every dose is drawn from, so
# it is never processed — 19 of the 20 slots are available.

project_name: bd
port:         5010
scene:        [scene/core_500.j2, scene/layout.j2]
recipes:      recipes.j2
actions:      actions.py
checks:       checks.py

plan_window:  4
scheduler:    cpsat

kwargs:
  tubes:
    type: slots
    component: rack_falcon_15ml_1
    exclude: ["D5"]
    exclude_hint: "D5 is the reservoir every dose is drawn from"
    default: ["A1"]
    label: Tubes to process
    hint: Tap the rack positions you loaded. Each selected tube runs the full chain.
  print_label:
    type: bool
    default: false
    label: Print label
    hint: Print and apply a barcode label on each tube (on the printer, right after the pick) before it is decapped. Off skips the printer entirely.
